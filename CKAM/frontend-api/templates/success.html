{% extends "base.html" %}
{% block content %}
<div class="content-card" style="text-align: center;">

    <!-- You can use an SVG checkmark icon for a nice visual cue -->
    <svg width="80" height="80" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin-bottom: 20px; color: #2ecc71;">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z" fill="currentColor"/>
    </svg>

    <h2 style="margin-bottom: 20px;">Request Submitted Successfully!</h2>
    
    <p class="subtitle" style="max-width: 600px; margin-left: auto; margin-right: auto;">
        Your request has been sent to the approvers.
    </p>

    <!-- A button to take the user back to the main request form if they need to make another request -->
    <a href="{{ url_for('request_access') }}" class="button-primary" style="text-decoration: none; display: inline-block; margin-top: 20px;">
        Make Another Request
    </a>
</div>

<!-- A little bit of CSS to style the new button -->
<style>
    .button-primary {
        background-color: var(--ck-blue);
        color: white;
        padding: 12px 24px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
        font-weight: 500;
        transition: all 0.2s ease;
    }
    .button-primary:hover {
        background-color: #2769d6;
    }
</style>

{% endblock %}
